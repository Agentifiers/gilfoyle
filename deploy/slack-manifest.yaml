# Create the Slack app from this manifest: https://api.slack.com/apps → Create New App → From a manifest.
# Then: Basic Information → App-Level Tokens → generate one with connections:write (SLACK_APP_TOKEN),
# and Install App → copy the Bot User OAuth Token (SLACK_BOT_TOKEN).
display_information:
  name: Gilfoyle
features:
  bot_user:
    display_name: Gilfoyle
    always_online: true
  code_channels:
    enabled: true
  app_home:
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - channels:read
      - chat:write
      - code_channels:manage
      - files:read
      - files:write
      - groups:history
      - groups:read
      - im:history
      - im:read
      - mpim:history
      - mpim:read
      - reactions:write
      - users:read
      - users:read.email
settings:
  event_subscriptions:
    bot_events:
      - agent_session_stopped
      - message.channels
      - message.groups
      - message.im
      - message.mpim
  socket_mode_enabled: true
